<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองห้องเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            background: #eef2f7;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100%;
            background: #4b2e83;
            color: white;
        }
        .sidebar h3 {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,.2);
        }
        .sidebar a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            transition: .3s;
        }
        .sidebar a:hover {
            background: #673ab7;
        }
        .main {
            margin-left: 250px;
            padding: 30px;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
        }
        .header {
            background: #4b2e83;
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .option-card {
            text-decoration: none;
            color: inherit;
            display: block;
            padding: 20px;
            border-radius: 12px;
            background: #f8f8ff;
            border: 1px solid #e3e3f7;
            transition: 0.2s ease;
            height: 100%;
        }
        .option-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }
        .option-card h4 { color: #4b2e83; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3><i class="fa-solid fa-desktop"></i> ระบบจอง</h3>
        <a href="index.html"><i class="fa fa-house"></i> หน้าหลัก</a>
        <a href="about.html"><i class="fa fa-school"></i> จองห้องเรียน</a>
        <a href="tables.html"><i class="fa fa-utensils"></i> จองโต๊ะโรงอาหาร</a>
        <a href="about2.html"><i class="fa fa-book"></i> จองที่นั่งห้องสมุด</a>
    </div>

    <div class="main">
        <div class="header">
            <h2>ระบบจองห้องเรียนและสถานที่ต่าง ๆ</h2>
            <p>เลือกบริการที่ต้องการจากตัวเลือกด้านล่าง</p>
        </div>

        <div class="card">
            <div class="card-body">
                <h3 class="mb-4"><i class="fa fa-users"></i> การจองของคนอื่น</h3>
                <div class="row gy-4">
                    <div class="col-12 col-lg-4">
                        <div class="option-card">
                            <h4><i class="fa fa-school"></i> จองห้องเรียน</h4>
                            <div id="classroomBookings"></div>
                            <div id="emptyClassroom" class="text-muted mt-3">ยังไม่มีการจองห้องเรียน</div>
                        </div>
                    </div>
                    <div class="col-12 col-lg-4">
                        <div class="option-card">
                            <h4><i class="fa fa-utensils"></i> จองโต๊ะโรงอาหาร</h4>
                            <div id="canteenBookings"></div>
                            <div id="emptyCanteen" class="text-muted mt-3">ยังไม่มีการจองโต๊ะโรงอาหาร</div>
                        </div>
                    </div>
                    <div class="col-12 col-lg-4">
                        <div class="option-card">
                            <h4><i class="fa fa-book"></i> จองที่นั่งห้องสมุด</h4>
                            <div id="libraryBookings"></div>
                            <div id="emptyLibrary" class="text-muted mt-3">ยังไม่มีการจองที่นั่งห้องสมุด</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </div>
    <script>
        // === ฟังก์ชันลบการจองอัตโนมัติ (เหมือนกับใน จับเวลา.html) ===
        function parseClassTimeRange(classTime, bookingDate) {
            if (!classTime) return null;
            const cleaned = String(classTime).trim().replace(/\./g, ':').replace(/\s+/g, '');
            const match = cleaned.match(/^(\d{1,2})(?::?(\d{1,2}))?-(\d{1,2})(?::?(\d{1,2}))?$/);
            if (!match) return null;
            const [ , startHour, startMin = '0', endHour, endMin = '0' ] = match;
            const baseDate = bookingDate ? new Date(`${bookingDate}T00:00:00`) : new Date();
            const start = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), Number(startHour), Number(startMin));
            let end = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), Number(endHour), Number(endMin));
            if (end <= start) end.setDate(end.getDate() + 1);
            return { start, end };
        }

        function saveBookingRecords(records) {
            localStorage.setItem('booking_records', JSON.stringify(records));
        }

        function saveTableBookings(bookings) {
            localStorage.setItem('table_bookings', JSON.stringify(bookings));
        }

        function saveLibraryBookings(bookings) {
            localStorage.setItem('library_bookings', JSON.stringify(bookings));
        }

        function cleanupExpiredClassrooms() {
            const records = JSON.parse(localStorage.getItem('booking_records') || '[]');
            const now = new Date();
            const valid = records.filter((booking) => {
                const bookingDate = String(booking.booking_date || '').trim() || new Date().toISOString().slice(0, 10);
                const range = parseClassTimeRange(booking.class_time, bookingDate);
                return !range || now <= range.end;
            });
            if (valid.length !== records.length) {
                saveBookingRecords(valid);
            }
        }

        function runAllCleanups() {
            cleanupExpiredClassrooms();
        }
        // =====================================

        function getBookingRecords() {
            return JSON.parse(localStorage.getItem('booking_records') || '[]');
        }

        function getTableBookings() {
            return JSON.parse(localStorage.getItem('table_bookings') || '[]');
        }

        function getLibraryBookings() {
            return JSON.parse(localStorage.getItem('library_bookings') || '[]');
        }

        function renderBookingList() {
            const roomBookings = getBookingRecords();
            const tableBookings = getTableBookings();
            const libraryBookings = getLibraryBookings();

            const classroomContainer = document.getElementById('classroomBookings');
            const canteenContainer = document.getElementById('canteenBookings');
            const libraryContainer = document.getElementById('libraryBookings');

            const emptyClassroom = document.getElementById('emptyClassroom');
            const emptyCanteen = document.getElementById('emptyCanteen');
            const emptyLibrary = document.getElementById('emptyLibrary');

            classroomContainer.innerHTML = roomBookings.map(booking => `
                <div class="mb-3 p-3 border rounded">
                    <div><strong>${booking.teacher_name || 'ผู้ใช้'}</strong></div>
                    <div>ห้อง: ${booking.room || '-'}</div>
                    <div>วันที่: ${booking.booking_date || '-'}</div>
                    <div>รายวิชา: ${booking.subject || '-'}</div>
                    <div>เวลา: ${booking.class_time || '-'}</div>
                    <div>นักเรียน: ${booking.students || '-'} คน</div>
                    <div class="text-muted">${booking.timestamp || '-'}</div>
                </div>
            `).join('');

            canteenContainer.innerHTML = tableBookings.map(booking => `
                <div class="mb-3 p-3 border rounded">
                    <div><strong>${booking.name || 'ผู้ใช้'}</strong></div>
                    <div>โต๊ะ: ${booking.table || '-'}</div>
                    <div>จำนวน: ${booking.people || '-'} คน</div>
                    <div class="text-muted">${booking.timestamp || '-'}</div>
                </div>
            `).join('');

            libraryContainer.innerHTML = libraryBookings.map(booking => `
                <div class="mb-3 p-3 border rounded">
                    <div><strong>${booking.teacher_name || booking.user || 'ผู้ใช้'}</strong></div>
                    <div>เลขที่นักเรียน: ${booking.student_code || '-'}</div>
                    <div>ที่นั่ง: ${booking.selected_tables ? booking.selected_tables.join(', ') : (booking.seat_number || '-')}</div>
                    <div class="text-muted">${booking.timestamp || '-'}</div>
                </div>
            `).join('');

            emptyClassroom.style.display = roomBookings.length ? 'none' : 'block';
            emptyCanteen.style.display = tableBookings.length ? 'none' : 'block';
            emptyLibrary.style.display = libraryBookings.length ? 'none' : 'block';
        }

        window.addEventListener('DOMContentLoaded', () => {
            runAllCleanups();        // ลบการจองที่หมดเวลาก่อนแสดงผล
            renderBookingList();
        });
    </script>
</body>
</html>
