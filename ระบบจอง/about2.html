<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองที่นั่งห้องสมุด</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #eef2f7;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100%;
            background: #4b2e83;
            color: white;
        }

        .sidebar h3 {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,.2);
        }

        .sidebar a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            transition: .3s;
        }

        .sidebar a:hover {
            background: #673ab7;
        }

        .main {
            margin-left: 250px;
            padding: 30px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
        }

        .header {
            background: #4b2e83;
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .tables-selector {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .table-box {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #fff;
            text-align: center;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .table-box:hover {
            border-color: #4b2e83;
            background: #f5f0ff;
        }

        .table-box.selected {
            border-color: #4b2e83;
            background: #dfe4ff;
        }

        .table-box.booked {
            background: #f0f0f0;
            color: #999;
            cursor: not-allowed;
            border-color: #ccc;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3><i class="fa-solid fa-book"></i> ระบบจองที่นั่งห้องสมุด</h3>
        <a href="index.html"><i class="fa fa-house"></i> หน้าหลัก</a>
    </div>

    <div class="main">
        <div class="header">
            <h2>ระบบจองที่นั่งห้องสมุด</h2>
            <p>Library Seat Booking System</p>
        </div>

        <div class="card">
            <div class="card-body">
                <h4 class="mb-4"><i class="fa fa-pen"></i> แบบฟอร์มจองที่นั่งห้องสมุด</h4>

                <form id="libraryForm" onsubmit="handleSubmit(event)">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>ชื่อผู้จอง</label>
                            <input type="text" class="form-control" id="teacher_name" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>เลขที่นักเรียน</label>
                            <input type="text" class="form-control" id="student_code" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>จุดประสงค์</label>
                            <select class="form-select" id="purpose">
                                <option value="อ่านหนังสือ">อ่านหนังสือ</option>
                                <option value="ทบทวนบทเรียน">ทบทวนบทเรียน</option>
                                <option value="ทำงานกลุ่ม">ทำงานกลุ่ม</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>หมายเหตุ</label>
                            <textarea class="form-control" rows="3" id="note"></textarea>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label>เลือกที่นั่ง</label>
                            <div class="tables-selector" id="seatGrid"></div>
                            <input type="hidden" id="selectedSeat" value="">
                            <div class="text-muted mt-2" id="seatLabel">ยังไม่ได้เลือกที่นั่ง</div>
                        </div>

                        <div class="col-md-12">
                            <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> บันทึกการจอง</button>
                            <a href="index.html" class="btn btn-secondary">กลับ</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // === ฟังก์ชันตรวจสอบข้อมูลที่ยังใช้งานได้ ===
        function parseClassTimeRange(classTime) {
            if (!classTime) return null;
            const cleaned = classTime.trim().replace(/\./g, ':').replace(/\s+/g, '');
            const match = cleaned.match(/^(\d{1,2})(?::?(\d{1,2}))?-(\d{1,2})(?::?(\d{1,2}))?$/);
            if (!match) return null;
            const [ , startHour, startMin = '0', endHour, endMin = '0' ] = match;
            const now = new Date();
            const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(startHour), Number(startMin));
            let end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(endHour), Number(endMin));
            if (end <= start) end.setDate(end.getDate() + 1);
            return { start, end };
        }

        function cleanupExpiredClassrooms() {
            const records = JSON.parse(localStorage.getItem('booking_records') || '[]');
            const now = new Date();
            const valid = records.filter((booking) => {
                const bookingDate = String(booking.booking_date || '').trim() || new Date().toISOString().slice(0, 10);
                const range = parseClassTimeRange(booking.class_time, bookingDate);
                return !range || now <= range.end;
            });
            if (valid.length !== records.length) {
                localStorage.setItem('booking_records', JSON.stringify(valid));
            }
        }
        // =====================================

        let selectedSeat = null;

        function getLibraryBookings() {
            return JSON.parse(localStorage.getItem('library_bookings') || '[]');
        }

        function saveLibraryBookings(bookings) {
            localStorage.setItem('library_bookings', JSON.stringify(bookings));
        }

        function getSeatData() {
            return JSON.parse(localStorage.getItem('library_seat_data') || '{}');
        }

        function saveSeatData(data) {
            localStorage.setItem('library_seat_data', JSON.stringify(data));
        }

        function renderSeatGrid() {
            const data = getSeatData();
            const grid = document.getElementById('seatGrid');
            const label = document.getElementById('seatLabel');
            const hiddenInput = document.getElementById('selectedSeat');

            let html = '';
            for (let i = 1; i <= 12; i++) {
                const seat = data[i] || {};
                const isBooked = seat.booked;
                const isSelected = selectedSeat === i;
                const className = isBooked ? 'table-box booked' : (isSelected ? 'table-box selected' : 'table-box');
                const buttonText = isBooked ? `ที่นั่ง ${i}<br><small>จองแล้ว</small>` : `ที่นั่ง ${i}`;

                html += `<button type="button" class="${className}" ${isBooked ? 'disabled' : ''} onclick="${isBooked ? `showBookedSeatMessage(${i})` : `selectSeat(${i})`}">${buttonText}</button>`;
            }

            grid.innerHTML = html;
            hiddenInput.value = selectedSeat || '';
            label.textContent = selectedSeat ? `เลือกแล้ว: ที่นั่ง ${selectedSeat}` : 'ยังไม่ได้เลือกที่นั่ง';
        }

        function selectSeat(seatNumber) {
            selectedSeat = seatNumber;
            renderSeatGrid();
        }

        function showBookedSeatMessage(seatNumber) {
            alert(`ที่นั่ง ${seatNumber} มีคนจองแล้ว`);
        }

        function handleSubmit(event) {
            event.preventDefault();

            if (!selectedSeat) {
                alert('กรุณาเลือกที่นั่งก่อนบันทึกการจอง');
                return;
            }

            const seatData = getSeatData();
            if (seatData[selectedSeat] && seatData[selectedSeat].booked) {
                alert('ที่นั่งนี้ถูกจองแล้ว');
                return;
            }

            const bookings = getLibraryBookings();
            const booking = {
                teacher_name: document.getElementById('teacher_name').value,
                student_code: document.getElementById('student_code').value,
                purpose: document.getElementById('purpose').value,
                note: document.getElementById('note').value,
                seat_number: selectedSeat,
                selected_tables: [selectedSeat],
                timestamp: new Date().toLocaleString('th-TH')
            };

            seatData[selectedSeat] = {
                booked: true,
                name: booking.teacher_name,
                student_code: booking.student_code,
                purpose: booking.purpose,
                note: booking.note,
                timestamp: booking.timestamp
            };

            bookings.push(booking);
            saveSeatData(seatData);
            saveLibraryBookings(bookings);

            document.getElementById('libraryForm').reset();
            selectedSeat = null;
            renderSeatGrid();
            alert('บันทึกการจองที่นั่งห้องสมุดเรียบร้อยแล้ว');
        }

        window.addEventListener('DOMContentLoaded', () => {
            cleanupExpiredClassrooms();
            renderSeatGrid();
        });
    </script>
</body>
</html>
