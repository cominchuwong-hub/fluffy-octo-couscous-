<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#eef2f7;
}

.sidebar{

position:fixed;

left:0;

top:0;

width:250px;

height:100%;

background:#4b2e83;

color:white;

}

.sidebar h3{

padding:20px;

text-align:center;

border-bottom:1px solid rgba(255,255,255,.2);

}

.sidebar a{

display:block;

padding:15px;

color:white;

text-decoration:none;

transition:.3s;

}

.sidebar a:hover{

background:#673ab7;

}

.main{

margin-left:250px;

padding:30px;

}

.card{

border:none;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}

.header{

background:#4b2e83;

color:white;

padding:20px;

border-radius:15px;

margin-bottom:20px;

}

.tables-selector {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    margin-top: 10px;
}

.table-box {
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: #fff;
    text-align: center;
    cursor: pointer;
    transition: 0.2s ease;
}

.table-box:hover {
    border-color: #4b2e83;
    background: #f5f0ff;
}

.table-box.selected {
    border-color: #4b2e83;
    background: #dfe4ff;
}

.table-box.booked {
    background: #f0f0f0;
    color: #999;
    cursor: not-allowed;
    border-color: #ccc;
}

</style>

</head>

<body>

<div class="sidebar">

<h3>
<i class="fa-solid fa-desktop"></i>

ระบบจองห้องเรียน

<a href="dashboard.php">

<i class="fa fa-house"></i>

หน้าหลัก

<i class="fa fa-list"></i>

รายการจอง

</a>

<a href="logout.php">

<i class="fa fa-right-from-bracket"></i>

ออกจากระบบ

</a>

</div>

<div class="main">

<div class="header">

<h2>

ระบบจองห้องเรียน

</h2>

<p>

Classroom Booking System

</p>

</div>

<div class="card">

<div class="card-body">

<h4 class="mb-4">

<i class="fa fa-pen"></i>

แบบฟอร์มจองห้องเรียน

</h4>

<form id="bookingForm" onsubmit="handleSubmit(event)">

<div class="row">

<div class="col-md-6 mb-3">

<label>ตัวแทนห้อง</label>

<input
type="text"
class="form-control"
id="teacher_name"
name="teacher_name"
required>

</div>

<div class="col-md-6 mb-3">

<label>แผนกวิชา</label>

<select
class="form-select"
id="department"
name="department"
required>

<option value="">เลือกแผนกวิชา</option>
<option>ช่างคอม</option>
<option>ช่างยน</option>
<option>ช่างกล</option>
<option>ช่างไฟฟ้า</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>ชั้นเรียน</label>

<select
class="form-select"
id="class_level"
name="class_level"
required>

<option value="">เลือกชั้นเรียน</option>

<option>ปวช.1</option>

<option>ปวช.2</option>

<option>ปวช.3</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>ห้องเรียน</label>

<select
class="form-select"
id="room"
name="room"
required>

<option>ห้อง401 </option>

<option>ห้อง402 </option>

<option>ห้อง403 </option>

<option>ห้อง404 </option>

<option>ห้อง405 </option>

<option>ห้อง406 </option>

<option>ห้อง407 </option>

<option>ห้อง408 </option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>รายวิชา</label>

<input
type="text"
class="form-control"
id="subject"
name="subject"
required>

</div>

<div class="col-md-6 mb-3">

<label>เวลาจองเรียน</label>

<input
type="text"
class="form-control"
id="class_time"
name="class_time"
placeholder="เช่น 08:00-10:00 หรือ วัน/เวลา"
required>

</div>

<div class="col-md-6 mb-3">

<label>จำนวนนักเรียน</label>

<select
class="form-select"
id="students"
name="students"
required>

<option value="">เลือกจำนวน</option>
<option>15</option>
<option>20</option>
<option>25</option>
<option>30</option>
<option>35</option>
<option>40</option>
<option>45</option>
<option>50</option>

</select>

</div>

<div class="col-md-12 mb-3">

<label>หมายเหตุ</label>

<textarea
class="form-control"
rows="3"
id="note"
name="note">

</textarea>

</div>

<div class="col-md-12">

<button
type="submit"
class="btn btn-success">

<i class="fa fa-save"></i>

บันทึกการจอง

</button>

<a
href="tables.html"
class="btn btn-secondary">

กลับ

</a>

</div>

</div>

</form>

<script>
function handleSubmit(event) {
    event.preventDefault();

    const selectedTable = document.getElementById('selected_table').value;
    if (!selectedTable) {
        alert('กรุณาเลือกที่นั่งก่อนบันทึกการจอง');
        return;
    }

    const formData = {
        teacher_name: document.getElementById('teacher_name').value,
        department: document.getElementById('department').value,
        class_level: document.getElementById('class_level').value,
        room: document.getElementById('room').value,
        subject: document.getElementById('subject').value,
        class_time: document.getElementById('class_time').value,
        students: document.getElementById('students').value,
        selected_table: selectedTable,
        note: document.getElementById('note').value,
        timestamp: new Date().toLocaleString('th-TH')
    };

    localStorage.setItem('pending_booking', JSON.stringify(formData));
    window.location.href = 'about2.html';
}
</script>

</div>

</div>

</div>

</body>
</html>
