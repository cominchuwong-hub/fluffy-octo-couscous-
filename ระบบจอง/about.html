<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>จองห้องเรียน</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#eef2f7;
}

.sidebar{

position:fixed;

left:0;

top:0;

width:250px;

height:100%;

background:#4b2e83;

color:white;

}

.sidebar h3{

padding:20px;

text-align:center;

border-bottom:1px solid rgba(255,255,255,.2);

}

.sidebar a{

display:block;

padding:15px;

color:white;

text-decoration:none;

transition:.3s;

}

.sidebar a:hover{

background:#673ab7;

}

.main{

margin-left:250px;

padding:30px;

}

.card{

border:none;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}

.header{

background:#4b2e83;

color:white;

padding:20px;

border-radius:15px;

margin-bottom:20px;

}

.tables-selector {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    margin-top: 10px;
}

.table-box {
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: #fff;
    text-align: center;
    cursor: pointer;
    transition: 0.2s ease;
}

.table-box:hover {
    border-color: #4b2e83;
    background: #f5f0ff;
}

.table-box.selected {
    border-color: #4b2e83;
    background: #dfe4ff;
}

.table-box.booked {
    background: #f0f0f0;
    color: #999;
    cursor: not-allowed;
    border-color: #ccc;
}

</style>

</head>

<body>

<div class="sidebar">

<h3>
<i class="fa-solid fa-desktop"></i>

ระบบจองห้องเรียน

</h3>

<a href="index.html">

<i class="fa fa-house"></i>

หน้าหลัก

</a>

</div>

<div class="main">

<div class="header">

<h2>

ระบบจองห้องเรียน

</h2>

<p>

Classroom Booking System

</p>

</div>

<div class="card">

<div class="card-body">

<h4 class="mb-4">

<i class="fa fa-pen"></i>

แบบฟอร์มจองห้องเรียน

</h4>

<form id="bookingForm" onsubmit="handleSubmit(event)">

<div class="row">

<div class="col-md-6 mb-3">

<label>ตัวแทนห้อง</label>

<input
type="text"
class="form-control"
id="teacher_name"
name="teacher_name"
required>

</div>

<div class="col-md-6 mb-3">

<label>แผนกวิชา</label>

<select
class="form-select"
id="department"
name="department"
required>

<option value="">เลือกแผนกวิชา</option>
<option>ช่างคอม</option>
<option>ช่างยน</option>
<option>ช่างกล</option>
<option>ช่างไฟฟ้า</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>ชั้นเรียน</label>

<select
class="form-select"
id="class_level"
name="class_level"
required>

<option value="">เลือกชั้นเรียน</option>

<option>ปวช.1</option>

<option>ปวช.2</option>

<option>ปวช.3</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>ห้องเรียน</label>

<select
class="form-select"
id="room"
name="room"
required
onchange="checkRoomStatus()">

<option value="">เลือกห้อง</option>
<option>ห้อง401</option>
<option>ห้อง402</option>
<option>ห้อง403</option>
<option>ห้อง404</option>
<option>ห้อง405</option>
<option>ห้อง406</option>
<option>ห้อง407</option>
<option>ห้อง408</option>

</select>
<div id="roomStatus" class="form-text mt-2">เลือกห้องเพื่อดูสถานะ</div>

</div>

<div class="col-md-6 mb-3">

<label>รายวิชา</label>

<input
type="text"
class="form-control"
id="subject"
name="subject"
required>

</div>

<div class="col-md-6 mb-3">

<label>วันที่จอง</label>

<input
type="date"
class="form-control"
id="booking_date"
name="booking_date"
required
onchange="checkRoomStatus()">

</div>

<div class="col-md-6 mb-3">

<label>เวลาจองเรียน</label>

<select
class="form-select"
id="class_time"
name="class_time"
required>

<option value="">เลือกเวลา</option>
<option value="08:00-08:30">08:00-08:30</option>
<option value="09:00-09:30">09:00-09:30</option>
<option value="10:00-10:30">10:00-10:30</option>
<option value="11:00-11:30">11:00-11:30</option>
<option value="13:00-13:30">13:00-13:30</option>
<option value="14:00-14:30">14:00-14:30</option>
<option value="15:00-15:30">15:00-15:30</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>จำนวนนักเรียน</label>

<select
class="form-select"
id="students"
name="students"
required>

<option value="">เลือกจำนวน</option>
<option>1-10</option>
<option>11-20</option>
<option>21-30</option>

</select>

</div>

<div class="col-md-12 mb-3">

<label>หมายเหตุ</label>

<textarea
class="form-control"
rows="3"
id="note"
name="note">

</textarea>

</div>

<div class="col-md-12">

<button
type="submit"
class="btn btn-success">

<i class="fa fa-save"></i>

บันทึกการจอง

</button>

<a
href="tables.html"
class="btn btn-secondary">

กลับ

</a>

</div>

</div>

</form>

<script>
// === ฟังก์ชันลบการจองที่หมดอายุจริง ๆ แบบคำนึงถึงวันที่ ===
function parseClassTimeRange(classTime, bookingDate) {
    if (!classTime) return null;
    const cleaned = String(classTime).trim().replace(/\./g, ':').replace(/\s+/g, '');
    const match = cleaned.match(/^(\d{1,2})(?::?(\d{1,2}))?-(\d{1,2})(?::?(\d{1,2}))?$/);
    if (!match) return null;

    const [ , startHour, startMin = '0', endHour, endMin = '0' ] = match;
    const baseDate = bookingDate ? new Date(`${bookingDate}T00:00:00`) : new Date();
    const start = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), Number(startHour), Number(startMin));
    let end = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), Number(endHour), Number(endMin));

    if (end <= start) {
        end.setDate(end.getDate() + 1);
    }

    return { start, end };
}

function cleanupExpiredClassrooms() {
    const records = JSON.parse(localStorage.getItem('booking_records') || '[]');
    const now = new Date();
    const valid = records.filter((booking) => {
        const bookingDate = String(booking.booking_date || '').trim() || new Date().toISOString().slice(0, 10);
        const range = parseClassTimeRange(booking.class_time, bookingDate);
        return !range || now <= range.end;
    });

    if (valid.length !== records.length) {
        localStorage.setItem('booking_records', JSON.stringify(valid));
        return true;
    }
    return false;
}

function getBookingRecords() {
    return JSON.parse(localStorage.getItem('booking_records') || '[]');
}

function saveBookingRecords(records) {
    localStorage.setItem('booking_records', JSON.stringify(records));
}

function populateClassTimeOptions() {
    const classTimeSelect = document.getElementById('class_time');
    if (!classTimeSelect) return;

    const currentValue = classTimeSelect.value;
    const validSlots = [
        '08:00-08:30',
        '09:00-09:30',
        '10:00-10:30',
        '11:00-11:30',
        '13:00-13:30',
        '14:00-14:30',
        '15:00-15:30'
    ];

    classTimeSelect.innerHTML = '<option value="">เลือกเวลา</option>' + validSlots.map((slot) => {
        const selected = currentValue === slot ? 'selected' : '';
        return `<option value="${slot}" ${selected}>${slot}</option>`;
    }).join('');
}

function checkRoomStatus() {
    const roomSelect = document.getElementById('room');
    const roomStatus = document.getElementById('roomStatus');
    const bookingDateInput = document.getElementById('booking_date');
    const selectedRoom = roomSelect.value;
    const selectedDate = bookingDateInput.value;

    if (!selectedRoom) {
        roomStatus.textContent = 'เลือกห้องเพื่อดูสถานะ';
        roomStatus.style.color = '#6c757d';
        return;
    }

    if (!selectedDate) {
        roomStatus.textContent = 'กรุณาเลือกวันที่ก่อนตรวจสอบสถานะ';
        roomStatus.style.color = '#6c757d';
        return;
    }

    const hasConflict = getBookingRecords().some((booking) => {
        const room = String(booking.room || '').trim();
        const date = String(booking.booking_date || '').trim();
        return room === selectedRoom && date === selectedDate;
    });

    if (hasConflict) {
        roomStatus.textContent = 'มีคนจองแล้วในวันที่นี้';
        roomStatus.style.color = '#dc3545';
    } else {
        roomStatus.textContent = 'ห้องนี้ว่างในวันที่เลือก';
        roomStatus.style.color = '#198754';
    }
}

function handleSubmit(event) {
    event.preventDefault();

    const room = document.getElementById('room').value;
    const bookingDate = document.getElementById('booking_date').value || new Date().toISOString().slice(0, 10);
    const classTime = document.getElementById('class_time').value.trim();

    if (!classTime) {
        alert('กรุณาเลือกเวลาจองเรียน');
        return;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const selectedDate = new Date(`${bookingDate}T00:00:00`);

    if (selectedDate < today) {
        alert('ไม่สามารถจองวันที่ผ่านมาได้');
        return;
    }

    const exists = getBookingRecords().some((booking) => {
        const sameRoom = String(booking.room || '').trim() === room;
        const sameDate = String(booking.booking_date || '').trim() === bookingDate;
        const sameTime = String(booking.class_time || '').trim() === classTime.trim();
        return sameRoom && sameDate && sameTime;
    });

    if (exists) {
        alert(`ห้อง ${room} ในวันที่ ${bookingDate} เวลา ${classTime} มีคนจองแล้ว ไม่สามารถจองซ้ำได้`);
        return;
    }

    const formData = {
        teacher_name: document.getElementById('teacher_name').value,
        department: document.getElementById('department').value,
        class_level: document.getElementById('class_level').value,
        room: room,
        subject: document.getElementById('subject').value,
        booking_date: bookingDate,
        class_time: classTime,
        students: document.getElementById('students').value,
        note: document.getElementById('note').value,
        timestamp: new Date().toLocaleString('th-TH')
    };

    const records = getBookingRecords();
    records.push(formData);
    saveBookingRecords(records);

    localStorage.setItem('pending_booking', JSON.stringify(formData));
    window.location.href = 'index.html';
}

window.addEventListener('DOMContentLoaded', () => {
    const bookingDateInput = document.getElementById('booking_date');
    if (bookingDateInput && !bookingDateInput.value) {
        bookingDateInput.value = new Date().toISOString().slice(0, 10);
    }

    populateClassTimeOptions();
    cleanupExpiredClassrooms();
    checkRoomStatus();
});
</script>

</div>

</div>

</div>

</body>
</html>
