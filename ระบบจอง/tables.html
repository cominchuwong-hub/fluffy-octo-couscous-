<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองโต๊ะโรงอาหาร</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #eef2f7;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100%;
            background: #4b2e83;
            color: white;
        }

        .sidebar h3 {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,.2);
        }

        .sidebar a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            transition: .3s;
        }

        .sidebar a:hover {
            background: #673ab7;
        }

        .main {
            margin-left: 250px;
            padding: 30px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
        }

        .header {
            background: #4b2e83;
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .tables-selector {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .table-box {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #fff;
            text-align: center;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .table-box:hover {
            border-color: #4b2e83;
            background: #f5f0ff;
        }

        .table-box.selected {
            border-color: #4b2e83;
            background: #dfe4ff;
        }

        .table-box.booked {
            background: #f0f0f0;
            color: #999;
            cursor: not-allowed;
            border-color: #ccc;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3><i class="fa-solid fa-utensils"></i> ระบบจองโต๊ะโรงอาหาร</h3>
        <a href="index.html"><i class="fa fa-house"></i> หน้าหลัก</a>
    </div>

    <div class="main">
        <div class="header">
            <h2>ระบบจองโต๊ะโรงอาหาร</h2>
            <p>Table Booking System</p>
        </div>

        <div class="card">
            <div class="card-body">
                <h4 class="mb-4"><i class="fa fa-pen"></i> แบบฟอร์มจองโต๊ะโรงอาหาร</h4>

                <form id="tableForm" onsubmit="handleSubmit(event)">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>ชื่อผู้จอง</label>
                            <input type="text" class="form-control" id="booker_name" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>จำนวนคน</label>
                            <select class="form-select" id="people_count" required>
                                <option value="">เลือกจำนวน</option>
                                <option>2</option>
                                <option>4</option>
                                <option>6</option>
                                
                            </select>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label>หมายเหตุ</label>
                            <textarea class="form-control" rows="3" id="note"></textarea>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label>เลือกโต๊ะ</label>
                            <div class="tables-selector" id="tableGrid"></div>
                            <input type="hidden" id="selected_table" value="">
                            <div class="text-muted mt-2" id="selectedTableLabel">ยังไม่ได้เลือกโต๊ะ</div>
                        </div>

                        <div class="col-md-12">
                            <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> บันทึกการจอง</button>
                            <a href="index.html" class="btn btn-secondary">กลับ</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // === ฟังก์ชันตรวจสอบข้อมูลที่ยังใช้งานได้ ===
        function parseClassTimeRange(classTime) {
            if (!classTime) return null;
            const cleaned = classTime.trim().replace(/\./g, ':').replace(/\s+/g, '');
            const match = cleaned.match(/^(\d{1,2})(?::?(\d{1,2}))?-(\d{1,2})(?::?(\d{1,2}))?$/);
            if (!match) return null;
            const [ , startHour, startMin = '0', endHour, endMin = '0' ] = match;
            const now = new Date();
            const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(startHour), Number(startMin));
            let end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(endHour), Number(endMin));
            if (end <= start) end.setDate(end.getDate() + 1);
            return { start, end };
        }

        function cleanupExpiredClassrooms() {
            const records = JSON.parse(localStorage.getItem('booking_records') || '[]');
            const now = new Date();
            const valid = records.filter((booking) => {
                const bookingDate = String(booking.booking_date || '').trim() || new Date().toISOString().slice(0, 10);
                const range = parseClassTimeRange(booking.class_time, bookingDate);
                return !range || now <= range.end;
            });
            if (valid.length !== records.length) {
                localStorage.setItem('booking_records', JSON.stringify(valid));
            }
        }
        // =====================================

        let selectedTable = null;

        function getTableData() {
            return JSON.parse(localStorage.getItem('restaurant_tables_data') || '{}');
        }

        function saveTableData(data) {
            localStorage.setItem('restaurant_tables_data', JSON.stringify(data));
        }

        function renderTableGrid() {
            const data = getTableData();
            const grid = document.getElementById('tableGrid');
            const label = document.getElementById('selectedTableLabel');
            const hiddenInput = document.getElementById('selected_table');

            let html = '';
            for (let i = 1; i <= 15; i++) {
                const table = data[i] || {};
                const isBooked = table.booked;
                const isSelected = selectedTable === i;
                const className = isBooked ? 'table-box booked' : (isSelected ? 'table-box selected' : 'table-box');
                const buttonText = isBooked ? `โต๊ะ ${i}<br><small>จองแล้ว</small>` : `โต๊ะ ${i}`;

                html += `<button type="button" class="${className}" ${isBooked ? 'disabled' : ''} onclick="selectTable(${i})">${buttonText}</button>`;
            }

            grid.innerHTML = html;
            hiddenInput.value = selectedTable || '';
            label.textContent = selectedTable ? `เลือกแล้ว: โต๊ะ ${selectedTable}` : 'ยังไม่ได้เลือกโต๊ะ';
        }

        function selectTable(tableNumber) {
            selectedTable = tableNumber;
            renderTableGrid();
        }

        function handleSubmit(event) {
            event.preventDefault();

            if (!selectedTable) {
                alert('กรุณาเลือกโต๊ะก่อนบันทึกการจอง');
                return;
            }

            const data = getTableData();
            if (data[selectedTable] && data[selectedTable].booked) {
                alert('โต๊ะนี้ถูกจองแล้ว');
                return;
            }

            data[selectedTable] = {
                booked: true,
                name: document.getElementById('booker_name').value,
                people: document.getElementById('people_count').value,
                note: document.getElementById('note').value
            };
            saveTableData(data);

            const bookings = JSON.parse(localStorage.getItem('table_bookings') || '[]');
            bookings.push({
                table: selectedTable,
                name: document.getElementById('booker_name').value,
                people: document.getElementById('people_count').value,
                note: document.getElementById('note').value,
                timestamp: new Date().toLocaleString('th-TH')
            });
            localStorage.setItem('table_bookings', JSON.stringify(bookings));

            document.getElementById('tableForm').reset();
            selectedTable = null;
            renderTableGrid();
            alert('บันทึกการจองโต๊ะเรียบร้อยแล้ว');
        }

        window.addEventListener('DOMContentLoaded', () => {
            cleanupExpiredClassrooms();
            renderTableGrid();
        });
    </script>
</body>
</html>
